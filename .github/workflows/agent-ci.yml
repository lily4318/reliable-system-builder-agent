name: Reliable System Builder Agent CI (read-only evaluation)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"
permissions:
  contents: read
concurrency:
  group: public-agent-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Public artifacts and privacy scan
        run: python -m src.agent_eval validate
      - name: Deterministic public policy evaluation
        run: python -m src.agent_eval evaluate --output output/evaluation-report.json
      - name: Independent read-only incident recovery acceptance
        run: python -m src.independent_acceptance evaluate --output output/recovery-acceptance.json
      - name: Candidate quality baseline and safety gate
        run: python -m src.quality_gate check --output output/quality-gate.json
      - name: Validate public synthetic outcome labels
        run: python -m src.feedback_eval validate --labels evaluations/feedback/synthetic-labels.json
      - name: Test baseline-to-candidate feedback comparison (synthetic only)
        run: python -m src.feedback_eval compare --labels evaluations/feedback/synthetic-labels.json --baseline evaluations/feedback/synthetic-baseline-predictions.json --candidate evaluations/feedback/synthetic-candidate-predictions.json --output output/feedback-synthetic.json
      - name: Validate offline structured synthetic task events
        run: python -m src.task_ingest validate --scope synthetic --input evaluations/ingestion/synthetic-events.json --authorization evaluations/ingestion/synthetic-authorization.json
      - name: Preview pending human review queue without writing
        run: python -m src.task_ingest preview --scope synthetic --input evaluations/ingestion/synthetic-events.json --authorization evaluations/ingestion/synthetic-authorization.json
      - name: Verify published task ingestion JSON schemas
        run: |
          python -m json.tool schemas/task-event-batch.schema.json > /dev/null
          python -m json.tool schemas/task-ingest-authorization.schema.json > /dev/null
          python -m json.tool schemas/pending-review-queue.schema.json > /dev/null
      - name: Attach non-sensitive evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-policy-evaluation
          path: |
            output/evaluation-report.json
            output/recovery-acceptance.json
            output/quality-gate.json
            output/feedback-synthetic.json
          if-no-files-found: ignore
          retention-days: 14
