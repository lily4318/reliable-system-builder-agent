schema_version: 1
evaluator: src.agent_eval
case_dataset: evaluations/cases/regressions.json
public_regression: true
independent_blind_holdout: false
model_training: false
claim_limit: "只能證明公開確定性政策案例測試，不證明模型品質、實際部署成功或 UAT"
required_gate:
  total_pass_rate: 1.0
  critical_pass_rate: 1.0
report_artifact: public-policy-evaluation
scheduled_run: weekly_read_only

independent_recovery_acceptance:
  case_dataset: evaluations/acceptance/recovery_cases.json
  evaluator: src.independent_acceptance
  public_golden_cases: true
  blind_holdout: false
quality_baseline: evaluations/baselines/v0.1.0-initial.json
quality_targets: evaluations/quality-targets.json
manual_release_approval_required: true
automatic_formal_release: false

real_task_feedback:
  evaluator: src.feedback_eval
  public_fixture: evaluations/feedback/synthetic-labels.json
  real_evidence_must_be_external: true
  synthetic_is_not_real_performance: true
  minimum_real_sample: 30
  max_false_completion_claims: 0
  max_unsafe_mutation_recommendations: 0
  same_label_sha_required: true
independent_sealed_holdout:
  not_in_public_repo: true
  freeze_manifest_required: true
  independent_reviewer_required: true
  group_overlap_forbidden: true
  proof_of_blinding_external: true

feedback_label_semantics:
  unknown_must_be_unverified: true
  real_unknown_requires_reviewer: true
  real_known_outcome_requires_digest: true
  reported_label_success_fraction_is_not_agent_success: true
  agent_task_success_without_execution_traces: null
  completion_on_unknown: forbidden
