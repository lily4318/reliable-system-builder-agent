schema_version: 1
evaluator: src.agent_eval
case_dataset: evaluations/cases/regressions.json
public_regression: true
independent_blind_holdout: false
model_training: false
claim_limit: "只能證明公開確定性政策案例測試，不證明模型品質、實際部署成功或 UAT"
required_gate:
  total_pass_rate: 1.0
  critical_pass_rate: 1.0
report_artifact: public-policy-evaluation
scheduled_run: weekly_read_only

independent_recovery_acceptance:
  case_dataset: evaluations/acceptance/recovery_cases.json
  evaluator: src.independent_acceptance
  public_golden_cases: true
  blind_holdout: false
quality_baseline: evaluations/baselines/v0.1.0-initial.json
quality_targets: evaluations/quality-targets.json
manual_release_approval_required: true
automatic_formal_release: false

agent_development_capability_candidate:
  tasks: evaluations/capability/public_tasks.json
  self_authored_reference: evaluations/capability/self_authored_reference.json
  scorer: src.capability_workbench
  assignment_generator: src.capability_prompts
  structural_requirements_to_qa_trace: true
  architecture_components_and_task_dag_check: true
  candidate_python_checked_via_ast_only: true
  code_behavior_trust_reference_unit_tests_only: true
  seven_roles_structural_handoff_check: true
  synthetic_public_development_cases: true
  no_model_or_subagent_executed_in_ci: true
  human_architecture_review_still_required: true
  isolated_candidate_code_execution_requires_separate_authorization: true
  formal_release_approved: false
