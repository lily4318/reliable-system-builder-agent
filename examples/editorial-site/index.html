<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>紙上｜編輯與刊物</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">紙上<span> / EDITORIAL</span></a><nav><button id="public-nav">閱讀刊物</button><button id="work-nav" hidden>編輯工作台</button><button id="login-nav">登入</button><button id="logout" hidden>登出</button></nav></header>
<main>
<p id="status" role="status" aria-live="polite">載入中</p>
<section id="public-panel">
<div class="hero"><p>THE EDITORIAL JOURNAL · 合成實戰</p><h1>在文字之間，<br>發現新視角。</h1><p>生活、文化、科技。僅展示已正式核准並發布的合成文章。</p></div>
<form id="search-form"><label for="search">搜尋文章標題</label><input id="search" maxlength="120"><label for="filter">分類</label><select id="filter"><option value="">全部</option><option>生活</option><option>文化</option><option>科技</option></select><button>搜尋</button></form>
<div id="articles"></div><div class="pager"><button id="prev">上一頁</button><span id="page-label"></span><button id="next">下一頁</button></div>
<article id="article-detail" hidden><button id="close-detail">返回文章列表</button><p id="detail-category"></p><h2 id="detail-title"></h2><p id="detail-body" class="body-text"></p></article>
</section>
<section id="login-panel" hidden><h1>編輯工作台登入</h1><form id="login-form"><label for="username">合成帳號</label><input id="username" autocomplete="username" required maxlength="80"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button>登入</button></form></section>
<section id="work-panel" hidden><h1 id="workspace-title">工作台</h1><button id="refresh">重新讀取</button>
<section id="create-panel" hidden><h2>新增文章</h2><form id="create-form"><label for="new-title">標題</label><input id="new-title" required maxlength="120"><label for="new-category">分類</label><select id="new-category"><option>生活</option><option>文化</option><option>科技</option></select><label for="new-body">內文（純文字）</label><textarea id="new-body" required maxlength="10000"></textarea><button>儲存草稿</button></form></section>
<h2>文章與修訂歷史</h2><div id="revisions"></div><h2>操作歷史</h2><div id="events"></div>
</section>
<section id="reconcile-panel" hidden><h2>操作結果未明</h2><p>暫停寫入，先查操作收據。禁止盲目重送。</p><button id="reconcile">唯讀查詢收據</button><p id="reconcile-status" role="status"></p></section>
</main><footer>紙上 · 本機合成網站，不是公開服務。無真人資料、無追蹤。</footer></body></html>
