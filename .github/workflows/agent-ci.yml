name: Reliable System Builder Agent CI (read-only evaluation)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"
permissions:
  contents: read
concurrency:
  group: public-agent-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Public artifacts and privacy scan
        run: python -m src.agent_eval validate
      - name: Deterministic public policy evaluation
        run: python -m src.agent_eval evaluate --output output/evaluation-report.json
      - name: Public capability assignment generator (no model invocation)
        run: python -m src.capability_prompts --task-id B001 --output output/capability-assignment.json
      - name: Offline B001-B005 execution packet preparation (NO runner invocation)
        run: python -m src.capability_execution prepare --output-dir output/capability-offline-packets
      - name: Self-authored capability reference structural regression (NOT agent skill)
        run: python -m src.capability_workbench evaluate --min-structural-score 100 --output output/capability-reference-report.json
      - name: Validate 13-question initial website discovery and editable review protocol
        run: |
          python -m src.website_discovery questions --output output/website-discovery-questions.json
          python -m src.human_walkthrough --task github_repository > output/github-manual-steps.json
      - name: Six synthetic website specification cases and editable confirmations (NOT model runs)
        run: |
          python -m src.website_scenario_eval validate
          python -m src.website_scenario_eval evaluate --output output/website-scenario-evaluation.json
          python -m src.website_scenario_eval packets --output output/website-scenario-tasks.json
      - name: Public holdout comparison protocol only (NO private cases, model or actual ratings)
        run: python -m src.website_holdout_compare protocol > output/website-private-holdout-protocol.json
      - name: Public synthetic walkthrough rehearsal (temporary local files, no model)
        run: |
          trial=$(mktemp -d)
          python -m src.website_holdout_walkthrough rehearse --directory "$trial/rehearsal"
      - name: Independent read-only incident recovery acceptance
        run: python -m src.independent_acceptance evaluate --output output/recovery-acceptance.json
      - name: Candidate quality baseline and safety gate
        run: python -m src.quality_gate check --output output/quality-gate.json
      - name: Attach non-sensitive evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-policy-evaluation
          path: |
            output/evaluation-report.json
            output/recovery-acceptance.json
            output/capability-assignment.json
            output/capability-reference-report.json
            output/website-discovery-questions.json
            output/github-manual-steps.json
            output/website-scenario-evaluation.json
            output/website-scenario-tasks.json
            output/website-private-holdout-protocol.json
            output/quality-gate.json
          if-no-files-found: ignore
          retention-days: 14
